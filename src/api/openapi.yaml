openapi: 3.0.3
info:
  title: Sample API
  description: JSONPlaceholder の /posts を使うサンプルの API 契約
  version: 1.0.0
servers:
  - url: https://jsonplaceholder.typicode.com
paths:
  /posts:
    get:
      operationId: listPosts
      summary: 投稿の一覧
      parameters:
        - name: userId
          in: query
          required: false
          description: 投稿者で絞り込む
          schema:
            type: integer
      responses:
        '200':
          description: 投稿の一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
    post:
      operationId: createPost
      summary: 投稿の作成
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPost'
      responses:
        '201':
          description: 作成した投稿
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
  /posts/{id}:
    get:
      operationId: getPost
      summary: 投稿の詳細
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 投稿
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
components:
  schemas:
    Post:
      type: object
      required: [id, userId, title, body]
      properties:
        id:
          type: integer
        userId:
          type: integer
        title:
          type: string
        body:
          type: string
    NewPost:
      type: object
      required: [userId, title, body]
      properties:
        userId:
          type: integer
        title:
          type: string
        body:
          type: string
